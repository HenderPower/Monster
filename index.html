<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Energy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
       
        <header class="header">
            <div class="logo">
                <img src="img/logo.png" alt="Monster Logo">
            </div>
            
            <nav class="nav-links">
                <img src="img/oferta.png" alt="PROMOÇÕES">
            </nav>

            <div class="lang-selector">
                <img src="img/language.png" alt="BR">
            </div>
        </header>

       
        <main class="main-content">
     
            <div class="text-group">
                <img src="img/frase.png" alt="Mega Monster Energy" class="img-title">
                <img src="img/texto.png" alt="O sabor de Monster..." class="img-description">
            </div>

           
            <div class="product-group">
        
                <img src="img/background.png" alt="" class="img-bg-claws">
    
   
                <img src="img/moster.png" alt="Lata Monster" class="img-can">
</div>

           
            <div class="extra-group">
                <img src="img/mostertype.png" alt="Monster Energy Original" class="img-original">
            </div>
        </main>

        
        <div class="carousel-controls">
            <button class="nav-btn"><a href="mosterpurple.html"><img src="img/esquerda.png" alt="<"></button></a>
            <button class="nav-btn"><a href="mosteryellow.html"><img src="img/direita.png" alt=">"></button></a>

    </div>

</html>
